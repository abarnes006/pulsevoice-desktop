name: Build & publish desktop installers

# Builds the PulseVoice desktop app for Windows, macOS, and Linux on GitHub's
# runners (which have the privileges electron-builder needs — local Windows
# builds fail on the winCodeSign symlink step) and publishes them as public
# release assets with stable names, so the website can link to
# /releases/latest/download/PulseVoice-Setup.exe (etc.).

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build & publish installer
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS has no cert yet — skip auto code-sign discovery so it still
          # produces an installer instead of failing on signing. Windows signs
          # explicitly via win.azureSignOptions in package.json (Azure Artifact
          # Signing), which ignores this flag.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Azure Artifact Signing auth (Windows only; unused on mac/linux).
          # DefaultAzureCredential picks these up automatically.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
